openapi: 3.0.3
info:
  title: studycheck API
  version: 1.4.0
  description: |
    学习打卡服务端接口。安卓端（Retrofit + kotlinx.serialization）按本文件对接。

    约定：
    - 所有业务接口前缀 `/api/v1`，语义冻结，只加字段不删字段
    - 鉴权：除注册/登录/健康检查外，全部需要 `Authorization: Bearer <token>`
    - 时间：RFC3339 带时区偏移，如 `2026-10-26T14:51:02+08:00`
    - 照片：上传用 `multipart/form-data` 字段名固定 `photo`；返回的是相对 URL（`/media/...`），
      客户端自行拼 baseUrl
    - 错误：统一 `{"error":{"code":"...","message":"..."}}`，客户端按 code 分支，不要解析 message
    - 会话：`access token` 短（默认 2h），`refresh token` 长（默认 90d）且每次刷新都轮换；
      旧的 refresh 被再次使用视为泄露，整条会话作废
    - 时区：客户端可带 `X-Timezone: Asia/Shanghai`，服务端按该时区判定「今天」
    - 幂等：打卡接口支持 `Idempotency-Key` 头（客户端生成 UUID），重放同一 key 不会产生新记录
    - 离线补传：打卡接口可带 `day`（YYYY-MM-DD，最多回溯 30 天）+ `taken_at` 补传历史记录
    - 照片访问：`/media/*` 需要鉴权，可用 `Authorization` 头或 `?token=<access>` 查询参数
    - 联调：服务端开 `SC_DEV_NO_AUTH=true` 时以上鉴权全部跳过，请求不带 token 也可调用
    - 压缩：响应支持 gzip（客户端带 `Accept-Encoding: gzip` 时自动生效）

servers:
  - url: https://your-domain.com
    description: 生产

tags:
  - name: auth
  - name: checkin
  - name: stats
  - name: system

paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: 健康检查（无鉴权）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: 1.1.0 }
                  min_supported_version: { type: string, example: 1.0.0 }
                  server_time: { type: string }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 注册（首个账号自动成为管理员；服务端可关闭注册）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                password: { type: string, minLength: 6 }
                nickname: { type: string }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '403':
          description: 已关闭注册（code=register_disabled）
        '409':
          description: 用户名已存在（code=user_exists）

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: 用户名或密码错误（code=bad_credentials）

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 用 refresh token 换新 access token（同时轮换 refresh token）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 新的会话（旧 refresh token 立即失效）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: refresh 无效/过期/已被使用（code=refresh_invalid）

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 吊销 refresh token（access token 到期自然失效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: 已吊销 }

  /api/v1/me:
    get:
      tags: [auth]
      summary: 当前用户
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [auth]
      summary: 修改昵称 / 每日目标
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string }
                daily_goal_min: { type: integer, minimum: 0, maximum: 1440 }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /api/v1/checkins/today:
    get:
      tags: [checkin]
      summary: 今日打卡状态（首页）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  day: { type: string, example: '2026-10-26' }
                  state:
                    type: string
                    enum: [not_started, in_library, finished]
                  checkin:
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/Checkin' }]
                  now: { type: string }

  /api/v1/checkins/in:
    post:
      tags: [checkin]
      summary: 进馆打卡（照片必填）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: 建议客户端先压到长边 1600 / WebP q0.82
                note: { type: string }
                place: { type: string }
                day:
                  type: string
                  example: '2026-10-26'
                  description: 可选，补传目标日期；不传按服务端「今天」，最多回溯 30 天
                taken_at:
                  type: string
                  description: 可选，拍摄时间 RFC3339；不传用服务端时间（更可信）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 打卡成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkin' }
        '409':
          description: 今天已进馆（code=already_checked_in）
        '413':
          description: 照片过大（code=photo_too_large / bad_photo），服务端在读取前即拒绝
        '400':
          description: 缺少照片或格式不支持

  /api/v1/checkins/out:
    post:
      tags: [checkin]
      summary: 出馆打卡（照片必填，需先有进馆记录）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
                note: { type: string }
                place: { type: string }
                day:
                  type: string
                  description: 可选，补传出馆日期（需该日已有进馆记录）
                taken_at: { type: string }
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 出馆成功，返回含 duration_sec 的完整记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkin' }
        '409':
          description: 未进馆（not_checked_in）或已出馆（already_checked_out）

  /api/v1/checkins:
    get:
      tags: [checkin]
      summary: 历史记录
      security: [{ bearerAuth: [] }]
      parameters:
        - name: month
          in: query
          schema: { type: string, example: '2026-10' }
          description: 按月过滤，与 limit/offset 叠加
        - name: limit
          in: query
          schema: { type: integer, default: 30, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: since
          in: query
          schema: { type: string, example: '2026-10-01T00:00:00+08:00' }
          description: 增量同步：只返回 updated_at 晚于该时间的记录
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Checkin' }
                  limit: { type: integer }
                  offset: { type: integer }
                  count: { type: integer }
                  server_time: { type: string }

  /api/v1/checkins/{id}:
    patch:
      tags: [checkin]
      summary: 手动修正进/出馆时间
      description: |
        用于忘记打点或时间点错的场景。只传需要改的字段。
        `out_at` 传空字符串表示清空（还没出馆），此时 duration_sec 置 0。
        时间必须落在这条记录的 `day` 当天，且出馆不能早于进馆。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                in_at: { type: string, format: date-time, example: '2026-10-26T09:00:00+08:00' }
                out_at: { type: string, nullable: true, description: '空字符串表示清空出馆' }
                in_note: { type: string }
                out_note: { type: string }
                in_place: { type: string }
                out_place: { type: string }
      responses:
        '200':
          description: 修正成功，返回更新后的完整记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkin' }
        '400':
          description: bad_json / bad_time / in_at_required / time_out_of_day / out_before_in
        '404': { description: 记录不存在（code=not_found） }
    delete:
      tags: [checkin]
      summary: 删除一条打卡（误操作撤销）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 已删除 }
        '404': { description: 不存在（code=not_found） }

  /api/v1/export/checkins.csv:
    get:
      tags: [export]
      summary: 导出打卡记录 CSV
      description: UTF-8 BOM，Excel 直接打开不乱码；时间按 X-Timezone 格式化。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: CSV 附件
          content:
            text/csv:
              schema: { type: string }

  /api/v1/export/entries.csv:
    get:
      tags: [export]
      summary: 导出笔记 CSV
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: CSV 附件
          content:
            text/csv:
              schema: { type: string }

  /api/v1/export/photos.zip:
    get:
      tags: [export]
      summary: 导出全部照片 ZIP（流式打包）
      description: 打卡照片与过程留存照片按日期命名，打包过程直接写响应，不占服务端内存。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ZIP 附件
          content:
            application/zip:
              schema: { type: string, format: binary }

  /api/v1/entries:
    get:
      tags: [entry]
      summary: 当天详情记录（过程留存）
      description: 返回指定日期（默认今天）的过程留存条目，含照片与笔记，按时间倒序。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: day
          in: query
          schema: { type: string, example: '2026-10-26' }
          description: 不传则按 X-Timezone 的今天
        - name: limit
          in: query
          schema: { type: integer, default: 60, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: since
          in: query
          schema: { type: string }
          description: 增量同步：只返回 updated_at 晚于该时间的记录（跨天）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Entry' }
                  count: { type: integer }
                  day: { type: string }
                  server_time: { type: string }
    post:
      tags: [entry]
      summary: 新增过程留存（连拍多张照片 / 纯笔记）
      description: |
        multipart/form-data。`photo` 可重复出现 1~12 次（连拍一次上传），
        `note` 可选；两者至少给一个。任意一张超限或格式不支持则整批不入库。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: array
                  maxItems: 12
                  items: { type: string, format: binary }
                note: { type: string, maxLength: 2000 }
                day: { type: string, example: '2026-10-26' }
      responses:
        '201':
          description: 创建成功，返回本次创建的条目
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Entry' }
                  count: { type: integer }
                  day: { type: string }
        '400':
          description: empty_entry / bad_photo / too_many_photos / bad_day
        '413':
          description: photo_too_large（单张超过 SC_MAX_PHOTO_MB）

  /api/v1/entries/{id}:
    delete:
      tags: [entry]
      summary: 删除一条过程留存
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 已删除 }
        '404': { description: 不存在（code=not_found） }

  /api/v1/stats:
    get:
      tags: [stats]
      summary: 统计（首页与统计页一次取全）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  today: { type: string }
                  total_days: { type: integer }
                  completed_days: { type: integer }
                  current_streak: { type: integer }
                  longest_streak: { type: integer }
                  total_minutes: { type: integer, format: int64 }
                  avg_minutes: { type: integer, format: int64 }
                  month_days: { type: integer }
                  month_minutes: { type: integer, format: int64 }
                  week_days: { type: integer }
                  week_minutes: { type: integer, format: int64 }
                  daily_goal_min: { type: integer }
                  heatmap:
                    type: array
                    items:
                      type: object
                      properties:
                        day: { type: string }
                        minutes: { type: integer, format: int64 }
                        has_photo: { type: boolean }
                  server_time: { type: string }

  /api/v1/system/update:
    get:
      tags: [system]
      summary: 更新状态（管理员）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
    post:
      tags: [system]
      summary: 立即更新（管理员；异步执行，服务会在 ~1s 后重启）
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: 已启动 }
        '409': { description: 无可用更新或已有更新进行中（code=update_failed） }
        '403': { description: 非管理员或更新未启用 }

  /api/v1/system/update/check:
    post:
      tags: [system]
      summary: 检查更新（管理员）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 状态（失败时 error 字段带原因）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }

  /api/v1/system/update/log:
    get:
      tags: [system]
      summary: 更新日志尾部（管理员）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  log: { type: string }
                  last_run: { type: string, enum: [none, running, ok, failed] }
                  running: { type: boolean }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: 客户端生成的唯一键；网络超时重试时复用同一个值，服务端不会产生重复记录

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Entry:
      type: object
      description: 当天的过程留存条目（照片可为空，纯笔记也算一条）
      properties:
        id: { type: integer, format: int64 }
        day: { type: string, example: '2026-10-26' }
        photo_url: { type: string, nullable: true, description: 原图地址（/media/…） }
        thumb_url: { type: string, nullable: true, description: 480px 缩略图 }
        note: { type: string }
        created_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        nickname: { type: string }
        daily_goal_min: { type: integer }
        is_admin: { type: boolean }
        created_at: { type: string }

    AuthResponse:
      type: object
      properties:
        token: { type: string, description: access token（Bearer） }
        expires_at: { type: string, description: access token 过期时间 }
        refresh_token: { type: string }
        refresh_expires_at: { type: string }
        user: { $ref: '#/components/schemas/User' }

    Checkin:
      type: object
      properties:
        id: { type: integer, format: int64 }
        day: { type: string, example: '2026-10-26' }
        in_at: { type: string, nullable: true }
        out_at: { type: string, nullable: true }
        in_photo_url: { type: string, nullable: true, example: /media/2026/10/26/ab12.jpg }
        out_photo_url: { type: string, nullable: true }
        in_thumb_url: { type: string, nullable: true, description: 列表用缩略图（480px）}
        out_thumb_url: { type: string, nullable: true }
        in_note: { type: string }
        out_note: { type: string }
        in_place: { type: string }
        out_place: { type: string }
        duration_sec: { type: integer, format: int64 }
        updated_at: { type: string, description: '用于 since 增量同步的时间戳' }

    UpdateStatus:
      type: object
      properties:
        enabled: { type: boolean }
        current_version: { type: string }
        latest_version: { type: string }
        has_update: { type: boolean }
        running: { type: boolean }
        last_run: { type: string, enum: [none, running, ok, failed] }
        error: { type: string }
        checked_at: { type: string }
        manifest_url: { type: string }
        notes: { type: string }
        service_name: { type: string }
        auto_update: { type: boolean }
