name: release

# 打 tag 发布正式版：v1.5.0 → 服务端二进制(amd64/arm64) + 一键安装脚本 + APK + Docker 镜像
# 推 main 分支 → 只构建 Docker 镜像并更新 :latest
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  server:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: server/go.sum

      - name: 构建单二进制（Web 前端已随 embed 打进二进制）
        run: |
          cd server
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o ../studycheck-linux-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goarch }}
          path: studycheck-linux-${{ matrix.goarch }}

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成一键脚本（内嵌 Release 下载地址）
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          sed "s|__BASE_URL__|${BASE}|g" deploy/onekey.sh > dist/install.sh
          chmod +x dist/install.sh
          grep -n 'BASE_URL=' dist/install.sh | head -1
          ! grep -q '__BASE_URL__' dist/install.sh

      - name: 生成 SHA256SUMS 与 latest.json
        id: hash
        run: |
          cd dist
          sha256sum studycheck-linux-amd64 studycheck-linux-arm64 install.sh > SHA256SUMS
          cat SHA256SUMS
          VER="${GITHUB_REF_NAME#v}"
          for ARCH in amd64 arm64; do
            SHA=$(awk -v a="studycheck-linux-$ARCH" '$2==a{print $1}' SHA256SUMS)
            SIZE=$(stat -c %s "studycheck-linux-$ARCH")
            URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/studycheck-linux-$ARCH"
            cat > "latest-$ARCH.json" <<EOF
          {
            "version": "$VER",
            "arch": "$ARCH",
            "url": "$URL",
            "sha256": "$SHA",
            "size": $SIZE,
            "notes": "自动化发布 ${GITHUB_REF_NAME}（$ARCH）"
          }
          EOF
            # 兼容旧版更新器：通用的 latest.json 指向 amd64
            if [ "$ARCH" = "amd64" ]; then cp "latest-$ARCH.json" latest.json; fi
          done
          cat latest-amd64.json
          echo "sha=$(awk '/studycheck-linux-amd64/{print $1}' SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: packaged
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        # 不用 android-actions/setup-android：新版镜像里它会对不存在的 "tools" 包报错，直接用预装 SDK 更稳
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager)"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: 还原签名密钥（可选）
        # 在仓库 Secrets 里配 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks
            printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=studycheck\nkeyPassword=%s\n' \
              "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              > android/keystore.properties
          else
            echo "未配置签名，使用 debug 签名产出可安装 APK"
          fi

      - name: 构建 APK
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
             ../studycheck-${GITHUB_REF_NAME#v}.apk
          # 稳定名字：releases/latest/download/studycheck.apk 永远指向最新正式包
          cp app/build/outputs/apk/release/app-release.apk ../studycheck.apk
          cd .. && sha256sum studycheck*.apk | tee apk-SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            studycheck-*.apk
            apk-SHA256SUMS

  publish:
    needs: [package, android]
    # APK 构建失败也照样发服务端与一键脚本，别让一个 job 拖垮整次发布
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载服务端产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: packaged

      - name: 下载 APK（缺了也继续）
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true
          pattern: android

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          FILES=(dist/studycheck-linux-amd64 dist/studycheck-linux-arm64 dist/install.sh dist/SHA256SUMS dist/latest.json dist/latest-amd64.json dist/latest-arm64.json)
          for f in dist/studycheck*.apk dist/apk-SHA256SUMS; do [ -f "$f" ] && FILES+=("$f"); done
          printf '上传 %s 个文件\n' "${#FILES[@]}"

          sed "s|__REPO__|$REPO|g" .github/release-notes.md > /tmp/notes.md

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "${FILES[@]}"
          else
            gh release create "$TAG" --repo "$REPO" --title "研读 $TAG" --notes-file /tmp/notes.md "${FILES[@]}"
          fi

# 服务器更新方式：
# 1) 重跑 install.sh（幂等，等同升级）
# 2) Docker：watchtower 拉 :latest
# 3) 二进制自更新：SC_UPDATE_MANIFEST_URL 指向 releases/latest/download/latest.json
